# Phase 0: Quick 5-hour validation run
# =====================================
# Goal: Verify training pipeline works end-to-end, losses converge,
# and the model produces reasonable output. NOT final quality.

# Pipeline stages
pipeline:
  apollo: true
  audiosr: true
  gan_upsample: true

# Output settings
output:
  sample_rate: 96000
  bit_depth: 24
  format: wav

# AudioSR settings
audiosr:
  model_name: basic
  ddim_steps: 50
  guidance_scale: 3.5

# GAN Upsampler settings
gan:
  generator:
    channels: 512
    upsample_rates: [2]            # 2x: 48kHz → 96kHz
    upsample_kernel_sizes: [4]
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]

  discriminator:
    periods: [2, 3, 5, 7, 11, 17, 23]  # Extended for 96kHz (orig HiFi-GAN was 22kHz)
    scales: 3

  training:
    batch_size: 8               # 96kHz output = half the memory, can double batch
    learning_rate_g: 0.0002
    learning_rate_d: 0.0002
    betas: [0.8, 0.99]
    epochs: 200
    segment_length: 16384       # ~0.34s at 48kHz, ~0.17s at 96kHz output
    lambda_fm: 2.0
    lambda_mel: 45.0
    lambda_stft: 45.0
    grad_clip_norm: 5.0         # Max gradient norm for clipping (both G and D)
    checkpoint_interval: 1
    log_interval: 50

    # Quality-aware weighted sampling (Lara's recommendation).
    # Ensures the model learns genuine harmonic generation from real hi-res
    # sources rather than overfitting on synthetic upsampled targets.
    # Weights are relative: hires draws ~70% of samples, midres ~20%, standard ~10%.
    # Set all three to 1.0 to revert to uniform sampling.
    quality_sampling:
      weight_hires: 7.0      # EG-IPT, VCTK (96kHz) — real HR targets
      weight_midres: 2.0     # GTSinger (48kHz) — 24-bit detail
      weight_standard: 1.0  # MUSDB, MusicNet, MAESTRO, MoisesDB (<=44.1kHz)

    mastering:
      lambda_perceptual_stft: 45.0
      lambda_stereo: 10.0
      lambda_dynamics: 5.0
      lambda_encodec: 0.01      # Raw encodec loss is very large; keep lambda low
      lambda_audiobox_pq: 0.0
      lambda_clap: 0.0

    # CD-quality input degradation (Phase 1 prep).
    # Applied to the LR input only; HR target stays clean.
    # Set prob to 0.0 to disable (default — no change to training behaviour).
    degradation:
      prob: 0.0           # Fraction of batches that get CD degradation applied [0, 1]
      cd_sr: 44100        # Intermediate CD sample rate
      bit_depth: 16       # Quantisation bit depth
      dither_amplitude: 0.5  # TPDF dither in LSBs (0.5 = standard)
